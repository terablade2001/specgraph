<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>specgraph</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<header id="bar"></header>
<div id="banner"></div>
<div id="main">
  <aside id="tree"></aside>
  <div class="split" id="splitL" title="Drag to resize; double-click for the default size"></div>
  <section id="center">
    <div id="tabs"></div>
    <div id="dtools"></div>
    <div id="canvasWrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg><div id="empty"></div>
      <div id="miniWrap" hidden title="Overview: click to look there, drag the box to move the view"><svg id="mini" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
    <div class="split h" id="splitB" title="Drag to resize; double-click for the default size" hidden></div>
    <div id="panel" hidden></div>
  </section>
  <div class="split" id="splitR" title="Drag to resize; double-click for the default size"></div>
  <aside id="props"></aside>
</div>
<div id="overlay" hidden></div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
